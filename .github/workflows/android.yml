name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from the Actions tab on GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # Generate the missing wrapper binaries/scripts using the runner's preinstalled gradle
    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.2

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: call-saver-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7

    - name: Generate IST Timestamped APK Name
      run: |
        export TZ='Asia/Kolkata'
        TIMESTAMP=$(date +'%b%d-%I%M%p-IST')
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/CallSaver-Latest-IST.apk
        echo "BUILD_TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV

    - name: Publish Direct APK to GitHub Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "app/build/outputs/apk/debug/CallSaver-Latest-IST.apk"
        tag: "latest"
        name: "CallSaver IST Build (${{ env.BUILD_TIMESTAMP }})"
        body: "Latest CallSaver APK Build (${{ env.BUILD_TIMESTAMP }} IST). Direct 1-tap download link: https://github.com/vvinaybhargav/saveContact/releases/download/latest/CallSaver-Latest-IST.apk"
        allowUpdates: true
        recreate: true
        removeArtifacts: true
        token: ${{ secrets.GITHUB_TOKEN }}
